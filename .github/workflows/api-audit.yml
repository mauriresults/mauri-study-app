name: Verify deployed API and stored PDFs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["backend/tools/audit_remote_api.py", ".github/workflows/api-audit.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify all PDFs within a bounded transfer budget
        run: python backend/tools/audit_remote_api.py
      - name: Save actual verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-audit-report
          path: api-audit-report.json
          if-no-files-found: error
