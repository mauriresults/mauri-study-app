name: API and importer tests
on:
  push:
    paths: ["backend/**", "scripts/**", ".github/workflows/backend-tests.yml"]
  pull_request:
    paths: ["backend/**", "scripts/**", ".github/workflows/backend-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Worker request tests
        working-directory: backend
        run: npm test
      - name: Importer validation tests
        run: python -m unittest discover -s scripts/tests -v
