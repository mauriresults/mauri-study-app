name: Build Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/build-android.yml"]
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: cd app && flutter create --org mr.mauri.study --project-name mauri_study --platforms android .
      - name: Configure Android permissions
        run: python scripts/configure_android.py
      - name: Resolve packages
        run: cd app && flutter pub get
      - name: Analyze
        run: cd app && flutter analyze
      - name: Run tests
        run: cd app && flutter test
      - name: Build unsigned preview APK
        if: github.event_name != 'pull_request'
        run: cd app && flutter build apk --debug --dart-define=API_BASE_URL=https://mauri-study-app-api.mauri-study-app.workers.dev
      - name: Verify remote API and PDF delivery
        if: github.event_name != 'pull_request'
        run: python scripts/verify_remote_api.py --check-download
      - name: Upload debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mauri-study-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
