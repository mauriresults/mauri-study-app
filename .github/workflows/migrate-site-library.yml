name: Import authorized Drive PDFs into independent app
on:
  # One-time bounded production import when the reviewed transfer PR is merged.
  # The guard below also requires an exact merge-commit marker.
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-site-library.yml'
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum queued files to attempt (1-100)"
        required: true
        default: "10"
        type: string
      max_total_mb:
        description: "Maximum new data to transfer this run (MB, 1-500)"
        required: true
        default: "100"
        type: string
      retry_failed:
        description: "Retry previously failed sources"
        required: true
        default: false
        type: boolean
      rights_confirmed:
        description: "Confirm authorization to republish this batch"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: independent-mauri-library-import
  cancel-in-progress: false
jobs:
  import:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rights_confirmed == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, 'import: trigger bounded 2026-11-06'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-import.txt
      - name: Transfer PDF objects and verify each SHA256 from R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
          RETRY_FAILED: ${{ github.event_name == 'push' && 'false' || inputs.retry_failed }}
          MAX_FILES: ${{ github.event_name == 'push' && '12' || inputs.max_files }}
          MAX_MB: ${{ github.event_name == 'push' && '30' || inputs.max_total_mb }}
        run: |
          args=(--limit "$MAX_FILES" --max-total-mb "$MAX_MB" --max-file-mb 10 --rights-confirmed)
          if [[ "$RETRY_FAILED" == 'true' ]]; then args+=(--retry-failed); fi
          python scripts/migrate_site_drive.py "${args[@]}"
