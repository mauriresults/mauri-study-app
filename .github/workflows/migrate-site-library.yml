name: Import authorized Drive PDFs into independent app
on:
  workflow_dispatch:
    inputs:
      max_files:
        description: "Maximum queued files to attempt (1-100)"
        required: true
        default: "10"
        type: string
      max_total_mb:
        description: "Maximum new data to transfer this run (MB, 1-500)"
        required: true
        default: "100"
        type: string
      retry_failed:
        description: "Retry previously failed sources"
        required: true
        default: false
        type: boolean
      rights_confirmed:
        description: "Confirm authorization to republish this batch"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  import:
    if: inputs.rights_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-import.txt
      - name: Transfer PDF objects and verify each SHA256 from R2
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GOOGLE_DRIVE_ACCESS_TOKEN: ${{ secrets.GOOGLE_DRIVE_ACCESS_TOKEN }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
          MAX_FILES: ${{ inputs.max_files }}
          MAX_MB: ${{ inputs.max_total_mb }}
        run: |
          args=(--limit "$MAX_FILES" --max-total-mb "$MAX_MB" --rights-confirmed)
          if [[ "$RETRY_FAILED" == 'true' ]]; then args+=(--retry-failed); fi
          python scripts/migrate_site_drive.py "${args[@]}"
