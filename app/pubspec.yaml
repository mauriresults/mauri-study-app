name: mauri_study
publish_to: none
description: Independent offline-first education library for Mauritanian students.
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6
  pdfx: ^2.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6

flutter:
  uses-material-design: true
